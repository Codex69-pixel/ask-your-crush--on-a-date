<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Grace 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Plus+Jakarta+Sans:wght@500;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="hearts" aria-hidden="true"></div>

<!-- 1. THE ASK -->
<section class="scene active" id="ask">
  <div class="mascot" id="m1" data-mood="normal"></div>
  <div class="sign">
    <h1 id="question">Grace, will you be my girlfriend?</h1>
    <p id="hint">I made this just for you 💌</p>
  </div>
  <div class="buttons">
    <button id="yes" class="btn yes">Yes 💖</button>
    <button id="no" class="btn no">No</button>
  </div>
</section>

<!-- 2. HOORAY + HUB -->
<section class="scene" id="hub">
  <div class="mascot sm" data-mood="happy"></div>
  <h2 class="script big">Hooray! You said yes! 🎉</h2>
  <p class="sub">Grace, you just made me the happiest person. Open these 💕</p>
  <div class="tiles">
    <button class="tile" data-go="note"><span>💌</span>Love note</button>
    <button class="tile" data-go="us"><span>📸</span>Us</button>
    <button class="tile" data-go="flowers"><span>💐</span>Flowers</button>
    <button class="tile" data-go="date"><span>🍷</span>Our date</button>
  </div>
</section>

<!-- 3. LOVE NOTE -->
<section class="scene" id="note">
  <h2 class="script">Words from my heart</h2>
  <div class="mascot sm corner" data-mood="normal"></div>
  <div class="paper"><div class="tape"></div><p id="letter"></p><div class="sig" id="sig"></div></div>
  <button class="btn back" data-go="hub">← back</button>
</section>

<!-- 4. US -->
<section class="scene" id="us">
  <h2 class="script">Forever together</h2>
  <div class="polaroid">
    <!-- 👉 Put your AI image of you two at photos/us.jpg -->
    <img src="photos/us.jpg" alt="Cyrus and Grace" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',innerHTML:'📷<br>Our picture goes here'}))">
    <div class="cap">Cyrus &amp; Grace 💗</div>
  </div>
  <div class="note-card" id="usnote"></div>
  <button class="btn back" data-go="hub">← back</button>
</section>

<!-- 5. FLOWERS -->
<section class="scene" id="flowers">
  <h2 class="script">Flowers for my love</h2>
  <div class="bouquet" id="bouquet"></div>
  <div id="stickies"></div>
  <button class="btn back" data-go="hub">← back</button>
</section>

<!-- 6. DATE -->
<section class="scene" id="date">
  <h2 class="script">Our first date as a couple 🥂</h2>
  <p class="sub">Pick as many as you like, Grace 💕</p>
  <div class="chips" id="chips"></div>
  <input type="date" id="when" aria-label="Pick a date">
  <button class="btn yes" id="send">Lock it in 💌</button>
  <p class="sub" id="done"></p>
  <button class="btn back" data-go="hub">← back</button>
</section>

<div id="ground" aria-hidden="true"></div>
<script src="./script.js"></script>
</body>
</html>
